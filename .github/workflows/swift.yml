name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
      - name: Clean Package
        run: swift package clean
      - name: Build without Graph trait
        run: swift build
      - name: Test with Graph trait
        run: swift test --traits EnableGraphAPI

  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4
      - name: Build without Graph trait
        run: swift build
      - name: Test with Graph trait
        run: swift test --traits EnableGraphAPI

  linux-traits:
    name: build (linux traits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4
      - name: Test meter conversion trait
        run: swift test --traits EnableMeterConversionExtensions
      - name: Test measurement conversion trait
        run: swift test --traits EnableMeasurementConversionExtensions
