name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  macos:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
      - name: Clean Package
        run: swift package clean
      - name: Build Test
        run: swift test

  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4
      - name: Build Test
        run: swift test
