name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
      - name: Clean Package
        run: swift package clean
      - name: Build without Graph trait
        run: swift build
      - name: Test with Graph trait
        run: swift test --traits EnableGraphAPI

  macos-min:
    name: build (macos, Swift 6.1)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.1"
      - name: Swift version
        run: swift --version
      - name: Build without Graph trait
        run: swift build
      - name: Test with Graph trait
        run: swift test --traits EnableGraphAPI

  apple-platforms:
    name: build (iOS/tvOS/watchOS simulators)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild -quiet -scheme GISTools \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for tvOS Simulator
        run: |
          xcodebuild -quiet -scheme GISTools \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tvOS" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for watchOS Simulator
        run: |
          xcodebuild -quiet -scheme GISTools \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-watchOS" \
            CODE_SIGNING_ALLOWED=NO build

  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4
      - name: Build without Graph trait
        run: swift build
      - name: Ensure Python
        run: command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)
      - name: Test with Graph trait and coverage
        run: swift test --traits EnableGraphAPI --enable-code-coverage
      - name: Coverage gate
        run: python3 scripts/refresh_coverage_report.py --minimum 87.5 --check

  linux-traits:
    name: build (linux traits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1

    steps:
      - uses: actions/checkout@v4
      - name: Test meter conversion trait
        run: swift test --traits EnableMeterConversionExtensions
      - name: Test measurement conversion trait
        run: swift test --traits EnableMeasurementConversionExtensions

  format:
    name: format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SwiftFormat
        run: |
          curl -sSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip -o /tmp/swiftformat.zip
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          chmod +x /tmp/swiftformat/swiftformat_linux
          sudo mv /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat
      - name: Lint changed Swift files
        run: |
          git fetch origin "${BASE_REF}"
          python3 scripts/check_swiftformat_changes.py --base "origin/${BASE_REF}"

  api-compatibility:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    env:
      BASE_REF: ${{ github.base_ref }}
      API_BREAKING_ACK: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch origin "${BASE_REF}"
      - name: Check public API against base branch
        shell: bash
        run: |
          set +e
          swift package diagnose-api-breaking-changes "origin/${BASE_REF}" \
            --products GISTools 2>&1 | tee api-breakage.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$API_BREAKING_ACK" = "true" ]; then
            echo "::warning::API breaking changes acknowledged by the api-breaking label."
            exit 0
          fi

          echo "::error::API breaking changes detected. Add the api-breaking label if intentional."
          exit "$status"
